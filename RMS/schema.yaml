title: Windows Server — join existing Active Directory
description: Launch a Windows VM in an existing network and join AD using credentials retrieved directly from OCI Vault by the instance.
schemaVersion: 1.1.0
version: "2.0.0"
locale: en
variableGroups:
  - title: Placement
    variables: [compartment_ocid, region, availability_domain]
  - title: Server
    variables: [instance_name, computer_name, windows_server_version, shape, ocpus, memory_in_gbs, boot_volume_size_in_gbs, image_ocid]
  - title: Existing network
    variables: [network_compartment_ocid, vcn_ocid, subnet_ocid, nsg_ocids, private_ip, assign_public_ip]
  - title: Active Directory
    variables: [ad_domain_name, override_dns, ad_dns_servers, ad_ou_path]
  - title: Join credentials in OCI Vault
    variables: [secret_compartment_ocid, ad_credentials_secret_ocid]
  - title: Temporary bootstrap tag (match the IAM stack)
    variables: [bootstrap_tag_namespace, bootstrap_tag_key, bootstrap_tag_value]
variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: Instance compartment
    required: true
  region:
    type: oci:identity:region:name
    title: Region
    required: true
  availability_domain:
    type: oci:identity:availabilitydomain:name
    title: Availability domain
    required: true
    dependsOn:
      compartmentId: ${compartment_ocid}
  instance_name:
    type: string
    title: Instance display name
    required: true
    default: windows-ad-member
  computer_name:
    type: string
    title: Windows computer name
    description: Unique in AD; 1–15 characters. Letters, numbers and internal hyphens only; not all numeric.
    required: true
    default: OCI-WIN01
    minLength: 1
    maxLength: 15
  windows_server_version:
    type: enum
    title: Windows Server version
    description: Latest compatible Standard Edition VM platform image. Availability varies by shape and region.
    required: true
    default: "2022"
    enum: ["2019", "2022", "2025"]
  shape:
    type: oci:core:instanceshape:name
    title: Shape
    description: x86 Standard Flex VM shapes; image compatibility and capacity are checked during deployment.
    required: true
    default: VM.Standard.E4.Flex
    pattern: '^VM\.Standard\.(E[3-9]|[3-9]|Intel[3-9])\.Flex$'
    dependsOn:
      compartmentId: ${compartment_ocid}
      availabilityDomain: ${availability_domain}
  ocpus:
    type: integer
    title: OCPUs
    default: 2
    minimum: 1
    maximum: 64
    required: true
  memory_in_gbs:
    type: integer
    title: Memory (GiB)
    default: 16
    minimum: 8
    maximum: 1024
    required: true
  boot_volume_size_in_gbs:
    type: integer
    title: Boot volume size (GiB)
    default: 100
    minimum: 100
    maximum: 32768
    required: true
  image_ocid:
    type: oci:core:image:id
    title: Optional image override
    description: Leave empty for automatic selection. For an override choose an unjoined Windows image of the selected version with Cloudbase-Init and Python/pip.
    required: false
    dependsOn:
      compartmentId: ${compartment_ocid}
      operatingSystem: Windows
      shape: ${shape}
  network_compartment_ocid:
    type: oci:identity:compartment:id
    title: Network compartment
    required: true
  vcn_ocid:
    type: oci:core:vcn:id
    title: Virtual cloud network
    required: true
    dependsOn:
      compartmentId: ${network_compartment_ocid}
  subnet_ocid:
    type: oci:core:subnet:id
    title: Subnet
    description: Must have connectivity to AD, AD DNS, OCI authentication/Secrets APIs and PyPI (unless SDK is preinstalled).
    required: true
    dependsOn:
      compartmentId: ${network_compartment_ocid}
      vcnId: ${vcn_ocid}
  nsg_ocids:
    type: string
    title: Network security groups (optional)
    description: Leave blank for no NSGs, or paste up to five NSG OCIDs separated by commas. All NSGs must belong to the selected VCN.
    required: false
    default: ""
  private_ip:
    type: string
    title: Optional private IPv4 address
    description: Leave empty for automatic allocation from the subnet.
    required: false
  assign_public_ip:
    type: boolean
    title: Assign a public IPv4 address
    description: Requires a public subnet. Default is private access through your existing VPN or bastion.
    default: false
  ad_domain_name:
    type: string
    title: Existing AD DNS domain
    description: For example corp.example.com
    required: true
  override_dns:
    type: boolean
    title: Override DNS servers before AD join
    description: Set DNS on the primary Windows network interface before domain discovery and joining. Leave unchecked to retain subnet/DHCP DNS, which must resolve the AD domain.
    default: false
  ad_dns_servers:
    type: string
    title: AD DNS server IPv4 addresses
    description: Comma-separated, for example 10.0.0.10,10.0.0.11. These resolvers must also resolve public/OCI names.
    required: true
    visible: ${override_dns}
  ad_ou_path:
    type: string
    title: Computer OU distinguished name (optional)
    description: For example OU=Servers,DC=corp,DC=example,DC=com. Empty uses the domain default computer container.
    required: false
  secret_compartment_ocid:
    type: oci:identity:compartment:id
    title: Secret compartment
    required: true
  ad_credentials_secret_ocid:
    type: oci:kms:secret:id
    title: AD join credential secret
    description: Select a secret in this region containing JSON with username and password. Only its OCID enters Terraform. See README for the exact format.
    required: true
    dependsOn:
      compartmentId: ${secret_compartment_ocid}
  bootstrap_tag_namespace:
    type: string
    title: Bootstrap tag namespace
    description: Must match the IAM stack. The tag is removed after verified domain join.
    default: ADJoinBootstrap
    required: true
    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
  bootstrap_tag_key:
    type: string
    title: Bootstrap tag key
    description: Must match the IAM stack. The tag is removed after verified domain join.
    default: State
    required: true
    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
  bootstrap_tag_value:
    type: string
    title: Bootstrap tag value
    description: Must match the IAM stack. The tag is removed after verified domain join.
    default: pending
    required: true
    pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
